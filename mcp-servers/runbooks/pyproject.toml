[project]
name = "runbooks-mcp"
version = "0.1.0"
description = "Serveur MCP : accès en lecture seule au corpus de runbooks."
readme = "README.md"
authors = [
    { name = "Védric EBOA EBOLO", email = "vedric@icloud.com" }
]
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28,<0.29",
    "mcp[cli]>=2,<3",
    "qdrant-client>=1.19,<2",
]

# Ni [project.scripts] ni [build-system] : ce projet n'est pas un paquet,
# c'est une paire de scripts. Les entrées sont server.py (lancé par
# .mcp.json et par outils.py) et indexer.py, toutes deux par chemin de
# fichier. Un script console déclaré ici ne démarrerait le serveur qu'au
# prix de le déplacer dans un paquet jamais distribué.
[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["server", "indexer", "fichiers"]

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "pytest==9.0.2",
    "ruff==0.15.10",
]
