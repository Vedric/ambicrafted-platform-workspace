version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /apps/console
      - /evals
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Animation-engine major changes require their own UX/motion qualification.
      - dependency-name: motion
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directories:
      - /agents/sre-agent
      - /mcp-servers/runbooks
      - /apps/control-api
      - /apps/voice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Local editable source, not the unrelated public package (ADR 0018).
    ignore:
      - dependency-name: "sre-agent"
      - dependency-name: "sre-agent[graphe]"
  - package-ecosystem: docker-compose
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "ambicrafted/*"
  - package-ecosystem: docker
    directories:
      - /gateway/images/qdrant
      - /gateway/images/postgres
      - /gateway/images/litellm
      - /gateway/images/prometheus
      - /gateway/images/tempo
      - /gateway/images/grafana
      - /gateway/images/platform-metrics
      - /gateway/images/neo4j
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # PostgreSQL major upgrades require an explicit data migration (ADR 0016).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Keep the currently qualified LTS build toolchain until explicit migration.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
