name: Qualified release

# A tag cannot publish a release while either required qualification is red.
# The draft preserves a final evidence review before public release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application:
    uses: ./.github/workflows/ci.yml
  images:
    uses: ./.github/workflows/images-security.yml
  draft:
    needs: [application, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft release bound to the qualified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Never replace an existing operator-authored release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for this qualified tag."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            --title "Ambicrafted $RELEASE_TAG"
