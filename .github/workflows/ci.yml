name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Tests, couverture, lint et construction
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [agents/sre-agent, mcp-servers/runbooks, apps/control-api, apps/voice]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Environnement neuf, verrou vérifié
        run: uv sync --locked --all-extras
      - name: Tests isolés et couverture des branches
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
          SRE_TRACAGE: "0"
          LANGSMITH_TRACING: "false"
        run: uv run --no-sync coverage run --branch -m pytest -q
      - run: uv run --no-sync coverage report
      - run: uv run --no-sync ruff check .
      - name: Typage du contrat agent
        if: matrix.project != 'mcp-servers/runbooks'
        run: uv run --no-sync mypy
      - name: Scripts de maintenance et verrous
        if: matrix.project == 'agents/sre-agent'
        run: |
          uv run --no-sync ruff check ../../scripts
          uv run --no-project --python 3.14 -m unittest discover -s ../../scripts -p test_scanner_images.py -v
          uv lock --check --script ../../scripts/plateforme.py
          uv lock --check --script ../../scripts/sauvegarder.py
          uv lock --check --script ../../scripts/tester_restauration.py
      - name: Construction du paquet
        if: matrix.project != 'mcp-servers/runbooks'
        run: uv build
      - name: Dépendances Python connues vulnérables
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --no-emit-package sre-agent --format requirements-txt -o /tmp/requirements.txt > /dev/null
          uvx pip-audit@2.10.1 -r /tmp/requirements.txt --disable-pip --no-deps
  hooks-compose:
    name: Hook et configuration Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .claude/hooks/test-block-secrets.sh
      - name: Compose valide sans secrets réels
        working-directory: gateway
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
  evals:
    name: Configuration des évaluations et dépendances npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.22.0"
      - run: npm install --global npm@11.10.0
      # Le paquet refuse une version Node incompatible via engine-strict.
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts --no-fund
        working-directory: evals
      - run: npm test
        working-directory: evals
      - run: npm audit --audit-level=moderate
        working-directory: evals
  console:
    name: Console, accessibilité et parcours navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.22.0"
      - run: npm install --global npm@11.10.0
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run typecheck:e2e
      - run: npm run format:check
      - run: npm test
      - run: uv sync --locked --project ../control-api
      - run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, clavier et WCAG
        run: npm run test:e2e
        env:
          CI: "true"
          SRE_TRACAGE: "0"
