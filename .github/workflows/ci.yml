name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Tests, couverture, lint et construction
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [agents/sre-agent, mcp-servers/runbooks, apps/control-api, apps/voice]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolated document parser and encrypted recovery dependencies
        if: matrix.project == 'apps/control-api'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap libseccomp2 apparmor-profiles
      - name: Verified age 1.3.1 recovery tool
        if: matrix.project == 'apps/control-api'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-qualified"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age-qualified/archive.tar.gz"
          printf '%s  %s\n' bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "$RUNNER_TEMP/age-qualified/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age-qualified/archive.tar.gz" -C "$RUNNER_TEMP/age-qualified"
          echo "$RUNNER_TEMP/age-qualified/age" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Environnement neuf, verrou vérifié
        run: uv sync --locked --all-extras
      - name: Real document sandbox and scoped Ubuntu AppArmor policy
        if: matrix.project == 'apps/control-api'
        run: bash ../../scripts/qualifier_sandbox_ci.sh
      - name: Tests isolés et couverture des branches
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
          SRE_TRACAGE: "0"
          LANGSMITH_TRACING: "false"
        run: uv run --no-sync coverage run --branch -m pytest -q
      - run: uv run --no-sync coverage report
      - run: uv run --no-sync ruff check .
      - name: Typage du contrat agent
        if: matrix.project != 'mcp-servers/runbooks'
        run: uv run --no-sync mypy
      - name: Scripts de maintenance et verrous
        if: matrix.project == 'agents/sre-agent'
        run: |
          uv run --no-sync ruff check ../../scripts
          uv run --no-project --python 3.14 -m unittest discover -s ../../scripts -p test_scanner_images.py -v
          uv lock --check --script ../../scripts/plateforme.py
          uv lock --check --script ../../scripts/sauvegarder.py
          uv lock --check --script ../../scripts/tester_restauration.py
      - name: Construction du paquet
        if: matrix.project != 'mcp-servers/runbooks'
        run: uv build
      - name: Synthetic workflow contracts and lifecycle recovery
        if: matrix.project == 'apps/control-api'
        run: |
          uv run --no-sync python ../../evals/qualify_agent.py validate
          uv run --no-sync python -m unittest discover -s ../../evals/tests -p test_qualification.py -v
          uv run --no-sync python -m unittest discover -s ../../scripts -p 'test_*.py' -v
          uv run --no-sync python ../../scripts/qualifier_cycle_vie.py --seconds 60 --output "${{ runner.temp }}/lifecycle-qualification.json"
      - name: Dépendances Python connues vulnérables
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --no-emit-package sre-agent --format requirements-txt -o /tmp/requirements.txt > /dev/null
          uvx pip-audit@2.10.1 -r /tmp/requirements.txt --disable-pip --no-deps
  speech-models:
    name: Voix FR/EN, modèles réels hors réseau
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VOICE_TEST_REAL: "1"
    defaults:
      run:
        working-directory: apps/voice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - run: uv sync --locked --all-extras
      - name: Modèles publics épinglés et vérifiés par SHA-256
        env:
          VOICE_STATE_DIR: ${{ runner.temp }}/ambicrafted-speech-models
        run: uv run --no-sync python -m voix_locale.cli installer
      - name: Provenance du calcul vocal
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path
          from voix_locale.moteur import hors_ligne
          hors_ligne()
          import ctranslate2
          cpu = next((line.split(":", 1)[1].strip()
                      for line in Path("/proc/cpuinfo").read_text().splitlines()
                      if line.startswith("model name")), "unknown")
          print(json.dumps({"architecture": platform.machine(), "cpu": cpu,
                            "ctranslate2": ctranslate2.__version__,
                            "ct2_use_mkl": os.environ["CT2_USE_MKL"],
                            "supported_cpu_compute_types": sorted(
                                ctranslate2.get_supported_compute_types("cpu"))}))
          PY
      - name: Reconnaissance, synthèse et codecs sans accès réseau
        env:
          VOICE_STATE_DIR: ${{ runner.temp }}/ambicrafted-speech-models
        # Only synthetic text/audio is used. Drop back to the runner's identity
        # after creating the network namespace; model files stay private to it.
        run: |
          sudo --preserve-env=VOICE_STATE_DIR,VOICE_TEST_REAL unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            "$PWD/.venv/bin/python" -m pytest -q tests/test_integration_reelle.py \
              --basetemp="${{ runner.temp }}/speech-synthetic-tests"
      - name: Synthetic speech failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-synthetic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/speech-synthetic-tests/**/*.wav
            ${{ runner.temp }}/speech-synthetic-tests/**/*.webm
            ${{ runner.temp }}/speech-synthetic-tests/**/*.ogg
          if-no-files-found: ignore
          retention-days: 7
      - name: Régressions FR/EN figées sous AVX2 sans réseau
        env:
          VOICE_STATE_DIR: ${{ runner.temp }}/ambicrafted-speech-models
          CT2_FORCE_CPU_ISA: AVX2
          ONEDNN_MAX_CPU_ISA: AVX2
          DNNL_MAX_CPU_ISA: AVX2
        # Exercise the numeric path that exposed the regression even when the
        # runner's native path passes. This is a test-only setting, not production.
        run: |
          sudo --preserve-env=VOICE_STATE_DIR,VOICE_TEST_REAL,CT2_FORCE_CPU_ISA,ONEDNN_MAX_CPU_ISA,DNNL_MAX_CPU_ISA unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            "$PWD/.venv/bin/python" -m pytest -q tests/test_integration_reelle.py \
              -k 'debut_de_parole_preserve or contexte_preserve_confidentialite or cli_neuf_ne_depend or donnees_francaises'
  hooks-compose:
    name: Hook et configuration Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .claude/hooks/test-block-secrets.sh
      - name: Compose valide sans secrets réels
        working-directory: gateway
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Dashboards générés et règles Prometheus
        run: |
          uv run --no-project --python 3.14 gateway/observability/build_dashboards.py --check
          docker run --rm --entrypoint promtool -v "$PWD/gateway/observability:/work:ro" -w /work prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e test rules alerts.test.yml
  evals:
    name: Configuration des évaluations et dépendances npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.10.0
      # Le paquet refuse une version Node incompatible via engine-strict.
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts --no-fund
        working-directory: evals
      - run: npm test
        working-directory: evals
      - run: npm audit --audit-level=moderate
        working-directory: evals
  console:
    name: Console, accessibilité et parcours navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.10.0
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run typecheck:e2e
      - run: npm run format:check
      - run: npm test
      - run: uv sync --locked --project ../control-api
      - name: Isolated document parser
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap libseccomp2 apparmor-profiles
      - name: Real document sandbox and scoped Ubuntu AppArmor policy
        run: bash ../../scripts/qualifier_sandbox_ci.sh
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Desktop, mobile, clavier et WCAG
        run: npm run test:e2e
        env:
          CI: "true"
          SRE_TRACAGE: "0"
      # The disposable browser server contains synthetic data and ephemeral credentials only.
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-browser-${{ github.run_id }}
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 7
