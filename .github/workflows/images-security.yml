name: Sécurité des images

# Reusable release gate. Each image gets a fresh runner and an independent report.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: images-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.service }}, seuil CRITICAL et HIGH
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: [litellm, postgres, tempo, prometheus, grafana, qdrant, platform-metrics, neo4j]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Space for source rebuilds on disposable hosted runners
        if: contains(fromJSON('["grafana", "prometheus", "tempo"]'), matrix.service)
        shell: bash
        run: |
          set -euo pipefail
          # These jobs compile inside Docker and do not use the preinstalled SDKs.
          # Never apply this preparation to a workstation or self-hosted runner.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc
          df -h /
          available=$(df --output=avail -B1 /var/lib/docker | tail -n 1)
          test "$available" -ge 26843545600
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Tests du scanner sans réseau ni Docker
        run: uv run --no-project --python 3.14 -m unittest discover -s scripts -p test_scanner_images.py -v
      - name: Trivy officiel, archive vérifiée avant exécution
        shell: bash
        env:
          TRIVY_DIRECTORY: ${{ runner.temp }}/trivy-0.74.0
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_DIRECTORY"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            'https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz' \
            --output "$TRIVY_DIRECTORY/trivy.tar.gz"
          printf '%s  %s\n' \
            '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' \
            "$TRIVY_DIRECTORY/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$TRIVY_DIRECTORY/trivy.tar.gz" -C "$TRIVY_DIRECTORY" trivy
          "$TRIVY_DIRECTORY/trivy" --version
      - name: Construire et analyser le service déclaré
        env:
          TRIVY_BINARY: ${{ runner.temp }}/trivy-0.74.0/trivy
          IMAGE_REPORTS: ${{ runner.temp }}/image-security-reports
          IMAGE_CACHE: ${{ runner.temp }}/image-security-cache
        run: |
          uv run --no-project --python 3.14 scripts/scanner_images.py \
            --compose gateway/docker-compose.yml --memory-compose gateway/neo4j-memory.yml \
            --trivy "$TRIVY_BINARY" --output "$IMAGE_REPORTS" --cache "$IMAGE_CACHE" \
            --service "${{ matrix.service }}"
      - name: Résumé même en cas de vulnérabilités ou d'erreur
        if: always()
        env:
          IMAGE_REPORTS: ${{ runner.temp }}/image-security-reports
        run: |
          if test -f "$IMAGE_REPORTS/summary.md"; then
            cat "$IMAGE_REPORTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Audit incomplet : vérifier les étapes précédentes. Aucune validation de sécurité.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver tous les rapports disponibles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-security-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-security-reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
