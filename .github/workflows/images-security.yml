name: Sécurité des images

# Reusable release gate. Each image gets a fresh runner and an independent report.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      service:
        description: Image to audit manually (release and scheduled runs always audit all)
        type: choice
        required: true
        default: all
        options: [all, litellm, postgres, tempo, prometheus, grafana, qdrant, platform-metrics, neo4j]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: images-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.service }}, seuil CRITICAL et HIGH
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # A called workflow inherits its caller's workflow name and event.
        # Only a direct manual invocation may narrow the immutable allowlist.
        # Unknown selections resolve to null and fail matrix validation; input
        # text is never interpolated into JSON or a shell command.
        service: ${{ fromJSON('{"all":["litellm","postgres","tempo","prometheus","grafana","qdrant","platform-metrics","neo4j"],"litellm":["litellm"],"postgres":["postgres"],"tempo":["tempo"],"prometheus":["prometheus"],"grafana":["grafana"],"qdrant":["qdrant"],"platform-metrics":["platform-metrics"],"neo4j":["neo4j"]}')[(github.workflow == 'Sécurité des images' && github.event_name == 'workflow_dispatch' && inputs.service) || 'all'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Space for source rebuilds on disposable hosted runners
        if: contains(fromJSON('["grafana", "prometheus", "tempo"]'), matrix.service)
        shell: bash
        run: |
          set -euo pipefail
          # These jobs compile inside Docker and do not use the preinstalled SDKs.
          # Never apply this preparation to a workstation or self-hosted runner.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc
          df -h /
          available=$(df --output=avail -B1 /var/lib/docker | tail -n 1)
          test "$available" -ge 26843545600
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Tests du scanner sans réseau ni Docker
        run: uv run --no-project --python 3.14 -m unittest discover -s scripts -p test_scanner_images.py -v
      - name: Trivy officiel, archive vérifiée avant exécution
        shell: bash
        env:
          TRIVY_DIRECTORY: ${{ runner.temp }}/trivy-0.74.0
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_DIRECTORY"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            'https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz' \
            --output "$TRIVY_DIRECTORY/trivy.tar.gz"
          printf '%s  %s\n' \
            '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' \
            "$TRIVY_DIRECTORY/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$TRIVY_DIRECTORY/trivy.tar.gz" -C "$TRIVY_DIRECTORY" trivy
          "$TRIVY_DIRECTORY/trivy" --version
      - name: Construire et analyser le service déclaré
        env:
          TRIVY_BINARY: ${{ runner.temp }}/trivy-0.74.0/trivy
          IMAGE_REPORTS: ${{ runner.temp }}/image-security-reports
          IMAGE_CACHE: ${{ runner.temp }}/image-security-cache
        run: |
          uv run --no-project --python 3.14 scripts/scanner_images.py \
            --compose gateway/docker-compose.yml --memory-compose gateway/neo4j-memory.yml \
            --trivy "$TRIVY_BINARY" --output "$IMAGE_REPORTS" --cache "$IMAGE_CACHE" \
            --service "${{ matrix.service }}"
      - name: Preserve scanner database provenance, including incomplete scans
        if: always()
        env:
          IMAGE_REPORTS: ${{ runner.temp }}/image-security-reports
          IMAGE_CACHE: ${{ runner.temp }}/image-security-cache
          TRIVY_DIRECTORY: ${{ runner.temp }}/trivy-0.74.0
        run: |
          uv run --no-project --python 3.14 - <<'PYTHON'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def digest(path):
              if path.is_symlink() or not path.is_file():
                  return None
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          reports = Path(os.environ["IMAGE_REPORTS"])
          cache = Path(os.environ["IMAGE_CACHE"])
          scanner = Path(os.environ["TRIVY_DIRECTORY"])
          databases = {}
          for name, filename in (("db", "trivy.db"), ("java-db", "trivy-java.db")):
              metadata = cache / name / "metadata.json"
              record = {"database_sha256": digest(cache / name / filename),
                        "metadata_sha256": digest(metadata), "metadata": None}
              if record["metadata_sha256"] is not None:
                  try:
                      record["metadata"] = json.loads(metadata.read_text(encoding="utf-8"))
                  except (ValueError, UnicodeError):
                      record["metadata_error"] = "Invalid database metadata"
              record["present"] = record["database_sha256"] is not None
              databases[name] = record
          expected_archive = "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
          archive = digest(scanner / "trivy.tar.gz")
          provenance = {
              "recorded_at": datetime.now(UTC).isoformat(),
              "scope": "Scanner inputs only; this record does not assert a complete or passing scan",
              "scanner": {"declared_version": "0.74.0",
                          "expected_archive_sha256": expected_archive,
                          "archive_sha256": archive,
                          "archive_matches_expected": archive == expected_archive,
                          "binary_sha256": digest(scanner / "trivy")},
              "databases": databases,
          }
          reports.mkdir(parents=True, exist_ok=True)
          (reports / "scanner-provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8"
          )
          PYTHON
      - name: Résumé même en cas de vulnérabilités ou d'erreur
        if: always()
        env:
          IMAGE_REPORTS: ${{ runner.temp }}/image-security-reports
        run: |
          if test -f "$IMAGE_REPORTS/summary.md"; then
            cat "$IMAGE_REPORTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Audit incomplet : vérifier les étapes précédentes. Aucune validation de sécurité.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver tous les rapports disponibles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-security-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-security-reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
