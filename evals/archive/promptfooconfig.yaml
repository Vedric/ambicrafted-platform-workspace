description: Local contre frontière sur tâches SRE réelles

# Authentification en moindre privilège : chaque fournisseur (juge compris)
# prend la clé virtuelle ORCHESTRATOR_KEY et l'URL de la passerelle dans
# l'environnement chargé par direnv depuis le .env du workspace. Aucun
# export manuel, et la master key LiteLLM n'est jamais utilisée ici : sa
# rotation n'a rien à propager (ADR 0007). Voir README.md.
providers:
  - id: openai:chat:local
    label: local-27b
    config:
      apiKeyEnvar: ORCHESTRATOR_KEY
      apiBaseUrl: "{{ env.LITELLM_BASE_URL }}"
      # Qwen3 a le mode reflexion actif par defaut : il consomme tout le
      # budget de tokens et laisse "content" vide. promptfoo affiche alors
      # le reasoning_content prefixe "Thinking:". think=false le desactive.
      # passthrough = seul canal promptfoo pour un param hors spec OpenAI.
      passthrough:
        think: false
      # promptfoo impose max_tokens=1024 par defaut : les deux modeles
      # finissaient en finish_reason="length", coupes en plein milieu, ce qui
      # pouvait faire echouer le juge sur un point absent parce que tronque,
      # pas parce que non traite. On mesure la reponse, pas la troncature.
      max_tokens: 4096
  - id: openai:chat:balanced
    label: frontiere-balanced
    config:
      apiKeyEnvar: ORCHESTRATOR_KEY
      apiBaseUrl: "{{ env.LITELLM_BASE_URL }}"
      max_tokens: 4096

defaultTest:
  options:
    # Juge des assertions llm-rubric : même clé, même passerelle. Un id nu
    # ici créerait un fournisseur sans config, qui retomberait sur
    # OPENAI_API_KEY.
    provider:
      id: openai:chat:balanced
      config:
        apiKeyEnvar: ORCHESTRATOR_KEY
        apiBaseUrl: "{{ env.LITELLM_BASE_URL }}"
  assert:
    - type: latency
      threshold: 180000

prompts:
  - "{{tache}}"

tests:
  - file://cas/01-iam-policy.yaml
