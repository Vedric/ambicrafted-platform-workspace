# Nom de projet explicite : les volumes s'appellent gateway_* quel que soit
# le nom du dossier (un clone ailleurs retrouve les mêmes données, ne crée
# pas une seconde stack vide en collision de ports). ADR 0006.
name: gateway

services:
  litellm:
    # Stable upstream plus pinned aiohttp/yarl/certifi and exact CA distrust.
    image: ambicrafted/litellm:1.104.4-stable-security.20261023.1
    build:
      context: ./images/litellm
      additional_contexts:
        trust-policy: ./images/trust-policy
    container_name: litellm
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: [.env]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    # Local derivative: pinned gosu rebuild and exact CA distrust.
    image: ambicrafted/postgres:16.15-alpine-security.20261022.2
    build:
      context: ./images/postgres
      additional_contexts:
        trust-policy: ./images/trust-policy
    container_name: litellm-db
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "litellm", "-d", "litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    # Rebuilt from the pinned source with the corrected Go toolchain.
    image: ambicrafted/tempo:3.0.3-security.20261021
    build:
      context: ./images/tempo
      additional_contexts:
        trust-policy: ./images/trust-policy
    container_name: tempo
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    command:
      - -config.file=/etc/tempo.yaml
      - -backend-scheduler.provider.work.compaction.block-retention=336h
      - -backend-worker.compaction.block-retention=336h
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo

  prometheus:
    image: ambicrafted/prometheus:3.15.0-security.20261022
    build:
      context: ./images/prometheus
      additional_contexts:
        trust-policy: ./images/trust-policy
    container_name: prometheus
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/slo.yml:/etc/prometheus/slo.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: ambicrafted/grafana:13.2.4-security.20261022.2
    build:
      context: ./images/grafana
      additional_contexts:
        trust-policy: ./images/trust-policy
    container_name: grafana
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/plateforme.json
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/json:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  platform-metrics:
    profiles: [observability]
    image: ambicrafted/platform-metrics:1.12.1-security.20261022
    build:
      context: ./images/platform-metrics
      additional_contexts:
        trust-policy: ./images/trust-policy
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --web.disable-exporter-metrics
    volumes:
      - type: bind
        source: ./observability/.textfile
        target: /textfile
        read_only: true
        bind:
          create_host_path: false
    # Internal Compose network only. No host port, socket, host filesystem or secret mount.

  qdrant:
    # Local security derivative; immutable base and exact package in Dockerfile.
    image: ambicrafted/qdrant:1.19.2-security.20261022-r4
    build:
      context: ./images/qdrant
      additional_contexts:
        trust-policy: ./images/trust-policy
    container_name: qdrant
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: ${PLATFORM_PGDATA_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
  tempodata:
    name: ${PLATFORM_TEMPODATA_VOLUME:-${COMPOSE_PROJECT_NAME}_tempodata}
  promdata:
    name: ${PLATFORM_PROMDATA_VOLUME:-${COMPOSE_PROJECT_NAME}_promdata}
  grafanadata:
    name: ${PLATFORM_GRAFANADATA_VOLUME:-${COMPOSE_PROJECT_NAME}_grafanadata}
  qdrantdata:
    name: ${PLATFORM_QDRANTDATA_VOLUME:-${COMPOSE_PROJECT_NAME}_qdrantdata}

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
