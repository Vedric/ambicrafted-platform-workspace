# Nom de projet explicite : les volumes s'appellent gateway_* quel que soit
# le nom du dossier (un clone ailleurs retrouve les mêmes données, ne crée
# pas une seconde stack vide en collision de ports). ADR 0006.
name: gateway

services:
  litellm:
    # Image vérifiée sur la pile isolée le 2026-09-26 ; digest immuable.
    image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    container_name: litellm
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: [.env]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    # Local security derivative; only the pinned gosu helper is rebuilt.
    image: ambicrafted/postgres:16.15-alpine-security.20260926
    build:
      context: ./images/postgres
    container_name: litellm-db
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "litellm", "-d", "litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    # Image vérifiée sur la pile isolée le 2026-09-26 ; digest immuable.
    image: ambicrafted/tempo:3.0.3-security.20260927
    build:
      context: ./images/tempo
    container_name: tempo
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    command:
      - -config.file=/etc/tempo.yaml
      - -backend-scheduler.provider.work.compaction.block-retention=336h
      - -backend-worker.compaction.block-retention=336h
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: ambicrafted/grafana:13.2.2-security.20260927
    build:
      context: ./images/grafana
    container_name: grafana
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/json:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    # Local security derivative; immutable base and exact package in Dockerfile.
    image: ambicrafted/qdrant:1.19.1-security.20260927
    build:
      context: ./images/qdrant
    container_name: qdrant
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  tempodata:
  promdata:
  grafanadata:
  qdrantdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
