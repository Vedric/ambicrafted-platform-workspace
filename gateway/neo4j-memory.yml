name: ambicrafted-memory
services:
  neo4j:
    image: ambicrafted/neo4j:5.26.32-memory.20261020
    build:
      context: ./images/neo4j
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:47474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_MEMORY_PASSWORD:?}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_db_transaction_timeout: 10s
      NEO4J_server_bolt_listen__address: "127.0.0.1:7687"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    volumes:
      - memory-data:/data
      - memory-logs:/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7474"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 60s
volumes:
  memory-data:
  memory-logs:
