{
  "groups": [
    {
      "name": "ambicrafted-slo-recording",
      "interval": "15s",
      "rules": [
        {
          "record": "ambicrafted:slo_target",
          "expr": "vector(0.999)",
          "labels": {
            "slo": "http_transport"
          }
        },
        {
          "record": "ambicrafted:slo_observation_valid",
          "expr": "((max(ambicrafted:telemetry_fresh) * max(ambicrafted_control_api_scrape_success{job=\"platform\"})) and on() (count(ambicrafted_http_requests_total{job=\"platform\",group=~\"analyses|conversations|speech_recognition|speech_synthesis|assistant|memory|knowledge\",outcome=~\"success|server_error\"}) > 0)) or vector(0)",
          "labels": {
            "slo": "http_transport"
          }
        },
        {
          "record": "ambicrafted:slo_coverage7d",
          "expr": "clamp_max(sum_over_time(ambicrafted:slo_observation_valid{slo=\"http_transport\"}[7d]) / 40320, 1)",
          "labels": {
            "slo": "http_transport"
          }
        },
        {
          "record": "ambicrafted:slo_events5m",
          "expr": "sum(increase(ambicrafted_http_requests_total{job=\"platform\",group=~\"analyses|conversations|speech_recognition|speech_synthesis|assistant|memory|knowledge\",outcome=~\"success|server_error\"}[5m]))",
          "labels": {
            "slo": "http_transport"
          }
        },
        {
          "record": "ambicrafted:slo_good_events5m",
          "expr": "sum(increase(ambicrafted_http_requests_total{job=\"platform\",group=~\"analyses|conversations|speech_recognition|speech_synthesis|assistant|memory|knowledge\",outcome=\"success\"}[5m]))",
          "labels": {
            "slo": "http_transport"
          }
        },
        {
          "record": "ambicrafted:slo_bad_ratio5m",
          "expr": "(clamp_min((ambicrafted:slo_events5m{slo=\"http_transport\"} - ambicrafted:slo_good_events5m{slo=\"http_transport\"}), 0) / ambicrafted:slo_events5m{slo=\"http_transport\"}) and (ambicrafted:slo_events5m{slo=\"http_transport\"} > 0)",
          "labels": {
            "slo": "http_transport"
          }
        },
        {
          "record": "ambicrafted:slo_burn5m",
          "expr": "ambicrafted:slo_bad_ratio5m{slo=\"http_transport\"} / (1 - ambicrafted:slo_target{slo=\"http_transport\"})",
