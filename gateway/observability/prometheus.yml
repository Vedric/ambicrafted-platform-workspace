global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
