global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml
scrape_configs:
  - job_name: platform
    scrape_interval: 15s
    scrape_timeout: 5s
    sample_limit: 5000
    static_configs:
      - targets: ["platform-metrics:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
