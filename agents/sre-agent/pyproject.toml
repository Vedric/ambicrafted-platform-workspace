[project]
name = "sre-agent"
version = "0.1.0"
description = "Agent SRE borné : analyse une alerte, cite ses runbooks, ne remédie jamais."
readme = "README.md"
authors = [
    { name = "Védric EBOA EBOLO", email = "vedric@icloud.com" }
]
requires-python = ">=3.14"
license = "Apache-2.0"

# Dépendances bornées : un plancher pour l'API utilisée, un plafond au
# majeur suivant. Aucun framework d'agent : la boucle est dans ce dépôt,
# c'est le sujet du livrable.
dependencies = [
    "httpx>=0.28,<0.29",
    "mcp>=2,<3",
    "pydantic>=2.13.5,<3",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

# Le portage LangGraph vit dans un extra : la version maison reste
# installable sans lui, sans quoi la comparaison de l'ADR 0004 mesurerait
# une empreinte de dépendances que la boucle maison ne paie pas.
[project.optional-dependencies]
graphe = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.scripts]
sre-agent = "sre_agent.cli:main"
sre-agent-graph = "sre_agent.cli_graphe:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/sre_agent"]
follow_imports = "silent"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["sre_agent"]

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "mypy==2.3.1",
    "pytest>=9,<10",
    "python-dotenv==1.2.3",
    "ruff==0.15.10",
]
